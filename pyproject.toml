[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoopic-campus-agent"
version = "0.1.0"
description = "Bounded, auditable campus ambassador discovery and review agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.38,<2"]

[project.optional-dependencies]
openai = ["openai>=1.40,<2"]
dns = ["dnspython>=2.6,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
campus-agent = "campus_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["campus_agent*"]
